[project]
name = "xeniu-scspace"
version = "0.1.0"
description = "Xenium -> scSpace data processing and analysis pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.11"
dependencies = [
    "scspace",
    "t20260507-xenium-dataset",
]

[project.scripts]
xenium-scspace = "xenium_scspace.cli:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["xenium_scspace*"]